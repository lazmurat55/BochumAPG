<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APG Bochum System</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Segoe UI;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    border:1px solid #334155;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:none;
    background:#0f172a;
    color:white;
}

button{
    background:#2563eb;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#1d4ed8;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.badge{
    background:#10b981;
    padding:6px 12px;
    border-radius:20px;
    display:inline-block;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="card">
<h2>APG BOCHUM LOGIN</h2>
<input type="text" id="user" placeholder="Benutzername">
<input type="password" id="pass" placeholder="Passwort">
<button onclick="login()">LOGIN</button>
</div>

<div class="card">
<h2>Schicht Bilgileri</h2>

<select id="schicht">
<option>A</option>
<option selected>B</option>
<option>C</option>
</select>

<input type="date" id="datum">

<select id="anlage">
<option>PUR1</option>
<option>PUR2</option>
<option>IM1</option>
<option>IM2</option>
<option>COM</option>
</select>
</div>

<div class="card">
<h2>Üretim Bilgileri</h2>

<div class="grid">
<input type="text" placeholder="Artikel">
<input type="number" placeholder="Dauer">
</div>

<div class="grid">
<input type="number" placeholder="Gutteile">
<input type="number" placeholder="Soll">
</div>

<div class="grid">
<input type="number" placeholder="Ausschuss">
<input type="number" placeholder="Störung">
</div>

<span class="badge">System Aktiv</span>

<button onclick="sendReport()">BERICHT SENDEN</button>
</div>

<div class="card">
<h2>Dashboard</h2>
<canvas id="chart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
function login(){
    alert('Login başarılı');
}

function sendReport(){
    const data={
        schicht:document.getElementById('schicht').value,
        datum:document.getElementById('datum').value,
        anlage:document.getElementById('anlage').value
    };

    console.log(data);

    alert('Bericht gönderildi');
}

new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{
        labels:['PUR1','PUR2','IM1'],
        datasets:[{
            label:'Produktion',
            data:[1200,900,700]
        }]
    }
});

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
