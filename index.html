<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APG Bochum BDE</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#0f172a">
</head>
<body>

<div class="container" id="mainContainer">

    <div id="loginScreen" class="form-card">
        <h2>APG BOCHUM LOGIN</h2>

        <label>Benutzername</label>
        <input type="text" id="userInp">

        <label>Passwort</label>
        <input type="password" id="passInp">

        <button class="btn-primary" onclick="checkLogin()">
            ANMELDEN
        </button>

        <div id="loginError"></div>
    </div>

    <div id="mainApp" style="display:none;">

        <div class="topbar">
            <span id="currentUserDisplay"></span>
            <button onclick="logout()">Abmelden</button>
        </div>

        <div class="form-card">

            <h3>Schicht</h3>

            <div class="schicht-group">
                <button class="schicht-btn" onclick="setSchicht('A')">A</button>
                <button class="schicht-btn active" onclick="setSchicht('B')">B</button>
                <button class="schicht-btn" onclick="setSchicht('C')">C</button>
            </div>

            <label>Datum</label>
            <input type="date" id="datum">

            <label>Anlage</label>
            <select id="anlage" onchange="onAnlageChange(this.value)">
                <option value="">Bitte wählen</option>
                <option value="PUR1">PUR1</option>
                <option value="PUR2">PUR2</option>
                <option value="PUR3">PUR3</option>
                <option value="COM">COM</option>
            </select>

        </div>

        <div class="form-card">
            <h3>Mitarbeiter</h3>

            <button class="sub-btn" onclick="openWorkerOverlay()">
                + Mitarbeiter
            </button>

            <div class="worker-container" id="workerDisplayContainer"></div>
        </div>

        <div class="form-card">

            <h3>Produktion</h3>

            <div id="artikelContainer"></div>

            <button id="addArtikelBtn"
                    class="add-artikel-dash-btn"
                    onclick="addArtikel()">
                + Artikel hinzufügen
            </button>

        </div>

        <button id="mainSendBtn"
                class="btn-primary"
                onclick="processReport()"
                disabled>
            Formular prüfen
        </button>

    </div>

</div>

<div class="overlay" id="workerOverlay">

    <div class="overlay-content">

        <h4>Mitarbeiter wählen</h4>

        <div id="workerList" class="worker-list"></div>

        <input type="text" id="manualWorker">

        <button class="btn-primary" onclick="addManualWorker()">
            Hinzufügen
        </button>

        <button class="sub-btn" onclick="closeOverlay()">
            Schließen
        </button>

    </div>

</div>

<script src="offline.js"></script>
<script src="workers.js"></script>
<script src="dashboard.js"></script>
<script src="app.js"></script>

</body>
</html>
