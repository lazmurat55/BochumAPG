<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APG Bochum Produktionssystem</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --border:#334155;
    --primary:#2563eb;
    --success:#10b981;
    --danger:#ef4444;
    --text:#f8fafc;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI;
    margin:0;
    padding:20px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:none;
    background:#0f172a;
    color:white;
}

button{
    background:var(--primary);
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.warn{
    background:var(--danger);
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}

.success{
    background:var(--success);
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}

.artikel{
    border:1px solid var(--border);
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}
</style>
</head>
<body>

<div class="card">
<h2>APG BOCHUM LOGIN</h2>

<input type="text" placeholder="Benutzername">
<input type="password" placeholder="Passwort">

<button>Anmelden</button>
</div>

<div class="card">
<h2>Schichtinformationen</h2>

<select>
<option>Schicht A</option>
<option selected>Schicht B</option>
<option>Schicht C</option>
</select>

<select>
<option>Frühschicht</option>
<option selected>Spätschicht</option>
<option>Nachtschicht</option>
</select>

<input type="date">

<select id="anlage">
<option>PUR1</option>
<option>PUR2</option>
<option>PUR3</option>
<option>IM1</option>
<option>IM2</option>
<option>COM</option>
</select>
</div>

<div class="card">
<h2>Produktion</h2>

<div id="artikelContainer"></div>

<button onclick="addArtikel()">+ Artikel hinzufügen</button>

<div id="comStatus" class="warn" style="display:none;">
Gesamtzeit muss genau 480 Minuten sein
</div>

<button style="margin-top:20px;" onclick="sendReport()">
Bericht senden
</button>
</div>

<div class="card">
<h2>Dashboard</h2>

<canvas id="chart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let artikelCount = 0;

function addArtikel(){

    artikelCount++;

    const div = document.createElement('div');

    div.className = 'artikel';

    div.innerHTML = `
        <div class="grid">
            <input type="text" placeholder="Artikelnummer">
            <input type="text" placeholder="Artikelname">
        </div>

        <div class="grid">
            <input type="number" class="dauer" placeholder="Arbeitszeit (Min)">
            <input type="number" placeholder="Gutteile">
        </div>

        <div class="grid">
            <input type="number" placeholder="Ausschuss">
            <input type="number" placeholder="Störung">
        </div>
    `;

    document.getElementById('artikelContainer').appendChild(div);

    updateCOM();
}

document.addEventListener('input', updateCOM);

function updateCOM(){

    const anlage = document.getElementById('anlage').value;

    const status = document.getElementById('comStatus');

    if(anlage !== 'COM'){
        status.style.display = 'none';
        return;
    }

    let total = 0;

    document.querySelectorAll('.dauer').forEach(inp=>{
        total += parseInt(inp.value) || 0;
    });

    if(total === 480){
        status.className = 'success';
        status.innerHTML = 'Gesamtzeit korrekt: 480 Minuten';
    }
    else{
        status.className = 'warn';
        status.innerHTML = 'Aktuelle Gesamtzeit: ' + total + ' / 480 Minuten';
    }

    status.style.display = 'block';
}

function sendReport(){
    alert('Bericht erfolgreich gesendet');
}

new Chart(document.getElementById('chart'),{
    type:'bar',
    data:{
        labels:['PUR1','PUR2','IM1'],
        datasets:[{
            label:'Produktion',
            data:[1200,900,700]
        }]
    }
});

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
