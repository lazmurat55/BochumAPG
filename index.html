<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schicht B</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <meta name="theme-color" content="#111827">
</head>
<body>

  <header class="topbar">
    <h1>SCHICHT B</h1>
    <div id="currentDate"></div>
  </header>

  <main class="container">

    <section class="card">
      <h2>Mitarbeiter</h2>

      <input type="text" id="mitarbeiter" placeholder="Mitarbeiter Name">

      <select id="schicht">
        <option>Frühschicht</option>
        <option>Spätschicht</option>
        <option>Nachtschicht</option>
      </select>
    </section>


    <section class="card">
      <h2>Produktion</h2>

      <select id="anlage">
        <option>PUR1</option>
        <option>PUR2</option>
        <option>PUR3</option>
        <option>PUR4</option>
        <option>PUR5</option>
        <option>PUR6</option>
        <option>PUR7</option>
        <option>PUR8</option>
        <option>PUR9</option>
        <option>IM1</option>
        <option>IM2</option>
        <option>IM3</option>
        <option>IM4</option>
        <option>IM5</option>
        <option>CIM1</option>
        <option>Compound</option>
      </select>

      <select id="formtraeger">
        <option>Formträger 1</option>
        <option>Formträger 2</option>
        <option>Formträger 3</option>
        <option>Formträger 4</option>
        <option>Formträger 5</option>
        <option>Formträger 6</option>
      </select>

      <input type="text" id="compound" placeholder="Compound">

      <input type="text" id="werkzeug" placeholder="Werkzeug">

      <input type="text" id="artikelnummer" placeholder="Artikelnummer">

      <input type="number" id="gutteile" placeholder="Gutteile">

      <input type="number" id="ausschuss" placeholder="Ausschuss">
    </section>


    <section class="card">
      <h2>Störung</h2>

      <select id="stoerungTyp">
        <option>Maschinenstörung</option>
        <option>Werkzeugbruch</option>
        <option>Materialmangel</option>
        <option>Wartung</option>
        <option>Qualitätsproblem</option>
      </select>

      <input type="number" id="stoerungMinuten" placeholder="Minuten">

      <button class="secondary-btn" onclick="addStoerung()">
        + Störung Hinzufügen
      </button>

      <div id="stoerungList"></div>
    </section>


    <section class="card">
      <h2>Werkzeugwechsel</h2>

      <input type="number" id="werkzeugwechsel" placeholder="Dauer in Minuten">
    </section>


    <section class="button-area">
      <button class="save-btn" onclick="saveData()">
        Speichern
      </button>

      <button class="reset-btn" onclick="resetForm()">
        Reset
      </button>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
